<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Productos</title>
<link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body>
<nav th:replace="~{menu :: menu}"></nav>
<main>
<h2>Catálogo de productos</h2>
<table>
<tr><th>Producto</th><th>Precio por kg (S/)</th></tr>
<tr th:each="p : ${productos.content}">
<td th:text="${p.nombre}"></td>
<td th:text="${p.precio}"></td>
</tr>
</table>

<div class="paginas">
<span th:text="'Página ' + (${productos.number + 1}) + ' de ' + ${productos.totalPages}"></span>
<a th:if="${productos.hasPrevious()}" th:href="@{/productos(page=${productos.number - 1})}">Anterior</a>
<a th:if="${productos.hasNext()}" th:href="@{/productos(page=${productos.number + 1})}">Siguiente</a>
</div>
</main>
</body>
</html>
